name: Publish G3D NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write # lets the called workflow get a GitHub OIDC token for NuGet trusted publishing
      contents: write # lets the called workflow push the release tag
    uses: ./.github/workflows/publish-nuget.yaml
    with:
      project_path: src/cs/g3d/Vim.G3d/Vim.G3d.csproj
      test_project_path: src/cs/g3d/Vim.G3d.Tests/Vim.G3d.Tests.csproj
      package_name: Vim.G3d
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
