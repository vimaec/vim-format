name: Publish NuGet

on:
  workflow_call:
    inputs:
      project_path:
        type: string
        required: true
      test_project_path:
        type: string
        required: true
      package_name:
        type: string
        required: true
    secrets:
      NUGET_USER:
        description: 'The nuget.org profile name (not an email address) for NuGet trusted publishing'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write # lets NuGet/login get a GitHub OIDC token for NuGet trusted publishing
      contents: write # lets the "Tag commit" step push the release tag
    steps:

    ############################
    ########## SETUP ###########
    ############################

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
          lfs: true

    - name: Install NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: '5.x'

    - name: Setup DotNet Environment
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Check version
      # composite actions don't support if-statements yet
      run: |
        ! [[ "${{ inputs.package_name }}" == "" ]] && \
        ./devops/check-nuget-version.sh ${{ inputs.project_path }} ${{ inputs.package_name }} \
        || true
      shell: bash

    ############################
    ########## BUILD ###########
    ############################

    - name: Restore dependencies
      run: dotnet restore ${{ inputs.project_path }}
      shell: bash

    - name: Build
      run: dotnet build -c Release --no-restore ${{ inputs.project_path }}
      shell: bash

    - name: Test
      run: dotnet test -c Release ${{ inputs.test_project_path }}
      shell: bash

    - name: Pack NuGet package
      env:
        NUGET_ENABLE_LEGACY_CSPROJ_PACK: true
      run: nuget pack ${{ inputs.project_path }} -IncludeReferencedProjects -Symbols -SymbolPackageFormat snupkg -OutputDirectory . -NonInteractive -Properties Configuration=Release -Exclude *.tt
      shell: bash

    ##############################
    ########## PUBLISH ###########
    ##############################

    # Trusted publishing: exchanges the GitHub OIDC token for a NuGet API key that is valid for 1 hour.
    # Requires a trusted publishing policy on nuget.org for this repository and workflow file.
    - name: NuGet login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push NuGet package
      env:
        NUGET_ENABLE_LEGACY_CSPROJ_PACK: true
      run: nuget push ${{ inputs.package_name }}*.nupkg -ApiKey ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
      shell: bash

    - name: Tag commit
      run: ./devops/cs-tag-commit.sh ${{ inputs.project_path }} ${{ inputs.package_name }}
      shell: bash
